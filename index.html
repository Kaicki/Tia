<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TIAFLIX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topo">
  <a href="#" class="logo" id="logo">TIAFLIX</a>
  <nav id="menu">
    <button data-view="inicio" class="ativo">Início</button>
    <button data-view="filmes">Filmes</button>
    <button data-view="series">Séries</button>
  </nav>
  <div class="busca">
    <input type="search" id="busca" placeholder="Buscar título..." autocomplete="off" aria-label="Buscar">
  </div>
</header>

<main>
  <section id="hero" class="hero"></section>
  <div id="filtros" class="filtros" hidden>
    <select id="fGenero" aria-label="Gênero"></select>
    <select id="fAno" aria-label="Ano"></select>
    <button id="limpar" type="button">Limpar</button>
  </div>
  <div id="conteudo"></div>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="fechar" id="fecharModal" aria-label="Fechar">&times;</button>
    <div id="modalCorpo"></div>
  </div>
</div>

<section id="player" class="player" hidden>
  <div class="player-topo">
    <button id="voltar" type="button">&larr; Voltar ao catálogo</button>
    <span id="playerTitulo"></span>
    <button id="telaCheia" type="button">⛶ Tela cheia</button>
  </div>
  <div class="video-area">
    <div id="videoWrap" class="video-wrap"></div>
  </div>
  <div id="playerInfo" class="player-info"></div>
</section>

<footer>© TIAFLIX / BERTAGLIA </footer>
<script src="script.js"></script>
</body>
</html>
